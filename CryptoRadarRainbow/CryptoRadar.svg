<svg height="100%" viewBox="0 0 255 109" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rainbow-grad" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#ff0055">
        <animate attributeName="stop-color" dur="4s" repeatCount="indefinite" values="#ff0055;#ff9900;#ffee00;#00e676;#00b0ff;#9c27b0;#ff0055"/>
      </stop>
      <stop offset="20%" stop-color="#ff9900">
        <animate attributeName="stop-color" dur="4s" repeatCount="indefinite" values="#ff9900;#ffee00;#00e676;#00b0ff;#9c27b0;#ff0055;#ff9900"/>
      </stop>
      <stop offset="40%" stop-color="#ffee00">
        <animate attributeName="stop-color" dur="4s" repeatCount="indefinite" values="#ffee00;#00e676;#00b0ff;#9c27b0;#ff0055;#ff9900;#ffee00"/>
      </stop>
      <stop offset="60%" stop-color="#00e676">
        <animate attributeName="stop-color" dur="4s" repeatCount="indefinite" values="#00e676;#00b0ff;#9c27b0;#ff0055;#ff9900;#ffee00;#00e676"/>
      </stop>
      <stop offset="80%" stop-color="#00b0ff">
        <animate attributeName="stop-color" dur="4s" repeatCount="indefinite" values="#00b0ff;#9c27b0;#ff0055;#ff9900;#ffee00;#00e676;#00b0ff"/>
      </stop>
      <stop offset="100%" stop-color="#9c27b0">
        <animate attributeName="stop-color" dur="4s" repeatCount="indefinite" values="#9c27b0;#ff0055;#ff9900;#ffee00;#00e676;#00b0ff;#9c27b0"/>
      </stop>
    </linearGradient>
    <style>
      .brand-text {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.6px;
      }
    </style>
  </defs>
  <rect fill="#000000" height="109" width="255"/>
  <text class="brand-text" dominant-baseline="middle" fill="url(#rainbow-grad)" text-anchor="middle" x="50%" y="54%">CryptoRadar</text>
